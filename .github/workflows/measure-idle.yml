name: measure-idle
on: {push: {branches: [measure-idle]}}
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}
      - run: |
          cat > kind.yaml <<'K'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes: [{role: control-plane}, {role: worker}, {role: worker}]
          K
          kind create cluster --config kind.yaml --wait 120s
      - name: install the umbrella chart with its defaults
        run: |
          set +e
          helm dependency build charts/open5gs
          helm install open5gs charts/open5gs -n open5gs --create-namespace -f ci/measure-values.yaml --wait --timeout 10m
          echo "helm exit=$?"
          kubectl get pods -n open5gs -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[0].ready,QOS:.status.qosClass,REQ:.spec.containers[0].resources.requests,LIM:.spec.containers[0].resources.limits
      - name: measure
        run: |
          set +e
          sleep 240
          echo "function anon_Mi file_Mi shmem_Mi kernel_Mi rss_of_pid1_Mi"
          for d in $(kubectl get deploy -n open5gs -o name | sed 's#.*/##'); do
            kubectl exec -n open5gs deploy/$d -- sh -c 'awk -v d='$d' "/^anon /{a=\$2} /^file /{f=\$2} /^shmem /{s=\$2} /^kernel /{k=\$2} END{printf \"%-20s %8.1f %8.1f %8.1f %8.1f \", d, a/1048576, f/1048576, s/1048576, k/1048576}" /sys/fs/cgroup/memory.stat; awk "/VmRSS/{printf \"%8.1f\\n\", \$2/1024}" /proc/1/status' 2>/dev/null
          done
          echo "=== upf"; kubectl exec -n open5gs deploy/open5gs-upf -- sh -c 'ps -eo pid,rss,vsz,comm | head; df -h /dev/shm /tmp 2>/dev/null | tail -2; ls -la /var/log/open5gs /opt/open5gs/var/log/open5gs 2>/dev/null | tail -4'

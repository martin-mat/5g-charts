# Fork only: dedicated_service_account and resource_requests on main and on #250's branch. Not for upstream.
name: SA measure (fork)
on:
  push:
    branches: [sa-measure]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        ref:
          - { name: main, repo: Gradiant/5g-charts, sha: a4670c0f10260eacb6d39e7f42f52d682faea664 }
        test: [cert]
    name: ${{ matrix.test }} (${{ matrix.ref.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CNTI_TESTSUITE_GENERIC_OPERATION_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.ref.repo }}
          ref: ${{ matrix.ref.sha }}
          persist-credentials: false
      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/open5gs
      - uses: lfn-cnti/testsuite-action@3c0e163cbbdde302cdd9abb9dbe8c2cbd6a72c71 # v1.4.0
        with:
          version: v2.4.1
          cnf_config: .github/cnti/cnti-testsuite.yaml
          install_timeout: 1200
          tests: ${{ matrix.test }}
          fail_on_failure: "false"
      - name: Service accounts and tokens of the pods
        if: always()
        run: |
          kubectl get pods -n open5gs -o custom-columns='POD:.metadata.name,SA:.spec.serviceAccountName,AUTOMOUNT:.spec.automountServiceAccountToken' || true
          kubectl get sa -n open5gs || true

  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        ref:
          - { name: main, repo: Gradiant/5g-charts, sha: a4670c0f10260eacb6d39e7f42f52d682faea664 }
          - { name: branch, repo: martin-mat/5g-charts, sha: c427b4be2221cb524d8971d26df84eac8719e1b9 }
    name: fresh install, defaults (${{ matrix.ref.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.ref.repo }}
          ref: ${{ matrix.ref.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.0
          wait: 120s
      - name: Install with the chart's defaults, then restarts after 2 minutes
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/open5gs >/dev/null
          helm install open5gs charts/open5gs -n open5gs --create-namespace --wait --timeout 15m
          sleep 120
          kubectl get pods -n open5gs -o custom-columns='POD:.metadata.name,SA:.spec.serviceAccountName,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount'

# Values for the CNTi Test Suite run of the open5gs umbrella chart: the 5G
# core only (no EPC parts, WebUI or subscriber population), MongoDB pinned
# and without persistence, every function started as PID 1 through the
# chart's command knob instead of the image entrypoint (which keeps a shell
# in front of the daemon), probes on the UPF, and resource requests sized
# for a 4-vCPU hosted runner.
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false
webui:
  enabled: false
populate:
  enabled: false
global:
  security:
    allowInsecureImages: true
mongodb:
  persistence:
    enabled: false
  image:
    repository: bitnamilegacy/mongodb
    tag: 8.0.13-debian-12-r0
amf:
  command:
  - open5gs-amfd
  args:
  - -c
  - /opt/open5gs/etc/open5gs/amf.yaml
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
ausf:
  command:
  - open5gs-ausfd
  args:
  - -c
  - /opt/open5gs/etc/open5gs/ausf.yaml
  resources:
    requests:

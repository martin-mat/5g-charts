upf:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  customLivenessProbe:
    exec:
      command:
      - pgrep
      - -x
      - open5gs-upfd
    initialDelaySeconds: 10
    periodSeconds: 10
  customReadinessProbe:
    exec:
      command:
      - pgrep
      - -x
      - open5gs-upfd
    initialDelaySeconds: 5
    periodSeconds: 10

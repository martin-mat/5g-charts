---
# CNTi Test Suite configuration for the open5gs umbrella chart in this
# repository; the values in ci/cnti-values.yaml select the 5G core and
# make it runnable on a hosted runner.
config_version: "v2"
common:
  # Addresses of the mobile data plane, set per deployment in the SMF and UPF
  # values, not Kubernetes networking: the resolvers the SMF hands to UEs,
  # and the gateway of the UE pool, which the UPF puts on its ogstun device.
  hardcoded_ip_exceptions:
    - ip: 8.8.8.8
    - ip: 8.8.4.4
    - ip: 10.45.0.1
deployments:
  helm_dirs:
    - name: open5gs
      helm_directory: charts/open5gs
      namespace: open5gs
      helm_values: -f ci/cnti-values.yaml
